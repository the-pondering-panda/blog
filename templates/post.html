<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <a href="../../index.html">&lt; Home</a>
    {% for cell in cells %}
    {% if cell.cell_type == "markdown" %}
    {{ cell.content | safe }}

    {% elif cell.cell_type == "code" %}
    <pre><code>{{ cell.content }}</code></pre>
    
    {% endif %}
    {% endfor %}
    <a href="../../index.html">&lt; Home</a>
</body>
</html>
